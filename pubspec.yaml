name: namecard_app
description: 名刺管理アプリ Ver0.9

publish_to: 'none'

version: 0.9.0+9

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # データ管理
  sqflite: ^2.3.3
  path: ^1.9.0

  # 状態管理
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0

  # URLスキーム
  app_links: ^6.0.0

  # 電話・メール
  url_launcher: ^6.3.0

  # アイコン
  cupertino_icons: ^1.0.8
  file_picker: ^12.3.0
  csv: ^8.0.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
